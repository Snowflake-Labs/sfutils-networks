[project]
name = "sfutils-networks"
version = "0.1.0"
description = "Snowflake network rules and policies manager - sfutils CLI package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "python-dotenv>=1.2.1",
    "requests>=2.28",
    "snowflake-cli>=3.16.0",
]

[project.scripts]
sfutils-networks = "sfutils_networks:cli"
check-setup = "sfutils_networks.check_setup:check"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfutils_networks"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
